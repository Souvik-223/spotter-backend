[project]
name = "spotter-backend"
version = "0.1.0"
description = "Spotter Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.0",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.7.0",
    "requests>=2.31.0",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".agents",
    ".claude",
    ".codex",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
exclude = [
    "^\\.agents/",
    "^\\.claude/",
    "^\\.codex/",
    "migrations/",
]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "spotter_fuel.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--ignore=.agents --ignore=.claude --ignore=.codex"


